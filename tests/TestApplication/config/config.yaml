imports:
    - { resource: "@ZangraSyliusBarcodePrintPlugin/config/config.yaml" }
    - { resource: "services_test.php" }

zangra_sylius_barcode_print:
    templates_path: '%kernel.project_dir%/../../../resources/labels'

twig:
    paths:
        '%kernel.project_dir%/../../../tests/TestApplication/templates': ~

# Remove if you do not need to extend entities
doctrine:
    orm:
        entity_managers:
            default:
                mappings:
                    TestApplication:
                        is_bundle: false
                        type: attribute
                        dir: '%kernel.project_dir%/../../../tests/TestApplication/src/Entity'
                        prefix: Tests\Zangra\SyliusBarcodePrintPlugin

sylius_twig_hooks:
    hooks:
        'sylius_admin.product_variant.update.content.header.title_block.actions':
            barcode_print_button:
                template: 'barcode_print_button.html.twig'
                priority: 400
